name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Task distribution and remote caching, only when the workspace is connected
      # to Nx Cloud. Must run before dependencies are installed.
      # https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js"
        if: env.NX_CLOUD_ACCESS_TOKEN != ''
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx nx format:check
      # Fails if a package.json dependency is missing from the TypeScript project references
      - run: npx nx sync:check
      - run: npx nx run-many -t lint typecheck test build

      # Nx Cloud recommends fixes for failures to help you get CI green faster.
      # https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: npx nx fix-ci
        if: always() && env.NX_CLOUD_ACCESS_TOKEN != ''
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
